name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: player-of-the-month
  REGISTRY: localhost:5000

jobs:
  test:
    runs-on: [self-hosted, windows, local]
    steps:
      - uses: actions/checkout@v4
      - name: Exécution des tests
        run: |
          echo "Exécution des tests..."
          php --version
          echo "Tests réussis !"

  build-image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, local]
    steps:
      - uses: actions/checkout@v4
      - name: Construction et push de l'image Docker vers le registre privé
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "Image construite et poussée : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"